<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2efe7" />
    <title>KAVACH — Explainable temporal video intelligence</title>
    <meta
      name="description"
      content="KAVACH turns video of physical operations into a numbered, auditable incident record. Vision and geometry write the evidence; the language model only reads it back. Every risk score opens into the components that produced it."
    />
    <link rel="canonical" href="https://forklift-safety-ai.vercel.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="KAVACH — Explainable temporal video intelligence" />

      property="og:description"
      content="Video of physical operations, turned into a record you can argue with. Eleven behaviour rules, decomposable risk scores, and a grounded assistant that cites the rows it used."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Self-hosted faces: latin and latin-ext subsets, generated by
         scripts/fetch_fonts.py. Linked here rather than imported from the
         module graph so the browser starts fetching them immediately. -->
    <link rel="preconnect" href="/" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <link
      rel="preload"
      href="/fonts/spectral-700-normal-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/archivo-400-700-normal-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
